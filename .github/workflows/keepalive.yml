# "Toque" diário ao Supabase para o plano gratuito não pausar o projeto
# por inatividade (pausa ao fim de 7 dias sem uso).
# Usa a configuração pública que já está em .env.production: não precisa de secrets.
name: Manter Supabase ativo
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Chamar a função ping()
        run: |
          set -a; . ./.env.production; set +a
          curl -sf -X POST "$VITE_SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $VITE_SUPABASE_ANON_KEY" -H "Authorization: Bearer $VITE_SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" -d '{}'
