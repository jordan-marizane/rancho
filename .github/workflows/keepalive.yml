# "Toque" diário ao Supabase para o plano gratuito não pausar o projeto
# por inatividade. Precisa de dois "secrets" no repositório GitHub:
#   SUPABASE_URL e SUPABASE_ANON_KEY (Settings > Secrets and variables > Actions)
name: Manter Supabase ativo
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar a função ping()
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Secrets ainda não configurados"; exit 0; fi
          curl -sf -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
